# chirpie.samcejko.eu -> the chirpie helper container (:8740). Goes into the site's nginx conf.d/ on the Pi.
# Plain http on purpose: iOS 6 cannot verify today's certificates; the public https side is terminated by the
# Cloudflare tunnel (add a public hostname chirpie.samcejko.eu -> http://192.168.1.154:80 in the dashboard).
server {
    listen 80;
    server_name chirpie.samcejko.eu;

    client_max_body_size 20m;   # photo uploads come in the POST /post body (base64 JSON)

    location / {
        proxy_pass http://192.168.1.154:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        # media (video.twimg.com MP4 ranges via /proxy) must not be buffered
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }
}
