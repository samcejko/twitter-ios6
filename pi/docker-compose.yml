# Chirpie helper service (multi-user, stateless).
# It stores NOTHING per user: each request carries the user's own X cookies and is signed with them once.
# Expose it with cloudflared / nginx pointed at 127.0.0.1:8740; the app just needs the address.
services:
  chirpie:
    build: .
    container_name: chirpie
    restart: unless-stopped
    ports:
      - "8740:8740"
    environment:
      - CHIRPIE_PORT=8740
