# Chirpie helper service (multi-user, stateless).
# It stores NOTHING per user: each request carries the user's own X cookies and is signed with them once.
# Set CHIRPIE_KEY if you expose it past the LAN (e.g. through cloudflared / nginx). Point those at 127.0.0.1:8740.
services:
  chirpie:
    build: .
    container_name: chirpie
    restart: unless-stopped
    ports:
      - "8740:8740"
    environment:
      - CHIRPIE_PORT=8740
      # - CHIRPIE_KEY=change-me
